<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coming Soon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:
radial-gradient(circle at top,#143d73 0%,#08111d 25%,#030507 55%,#000 100%);
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
padding:20px;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(transparent 96%,rgba(0,153,255,.06) 100%),
linear-gradient(90deg,transparent 96%,rgba(0,153,255,.06) 100%);
background-size:35px 35px;
opacity:.25;
pointer-events:none;
}

.card{
width:100%;
max-width:430px;
padding:34px 22px;
text-align:center;
border-radius:24px;
background:rgba(15,20,35,.75);
backdrop-filter:blur(15px);
border:1px solid rgba(0,162,255,.15);
box-shadow:
0 0 20px rgba(0,140,255,.12),
0 0 70px rgba(0,80,255,.12);
}

.logo{
width:95px;
height:95px;
display:block;
margin:auto;
border-radius:24px;
box-shadow:0 0 35px rgba(0,140,255,.35);
}

.brand{
margin-top:14px;
font-size:23px;
font-weight:700;
letter-spacing:.6px;
color:#fff;
}

h1{
margin-top:18px;
font-size:40px;
font-weight:800;
color:#ffffff;
text-shadow:0 0 15px rgba(0,140,255,.45);
}

.subtitle{
margin-top:14px;
font-size:15px;
line-height:1.7;
color:#bddcff;
}

.countdown{
margin-top:35px;
display:flex;
justify-content:space-between;
gap:10px;
}

.box{
flex:1;
padding:14px 4px;
border-radius:16px;
background:rgba(255,255,255,.05);
border:1px solid rgba(0,140,255,.18);
}

.number{
font-size:24px;
font-weight:700;
color:#fff;
}

.label{
margin-top:5px;
font-size:10px;
text-transform:uppercase;
letter-spacing:1px;
color:#72c7ff;
}

.social{
display:flex;
justify-content:center;
gap:18px;
margin-top:34px;
}

.social a{
width:52px;
height:52px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:rgba(255,255,255,.05);
border:1px solid rgba(0,140,255,.2);
transition:.25s;
}

.social a:hover{
transform:translateY(-5px);
box-shadow:0 0 20px rgba(0,140,255,.45);
}

.social img{
width:28px;
height:28px;
filter:invert(1);
}

.footer{
margin-top:30px;
font-size:13px;
color:#8ecbff;
font-weight:500;
}

.footer span{
color:#ffffff;
font-weight:700;
}

@media(max-width:420px){

.card{
padding:28px 16px;
}

.brand{
font-size:20px;
}

h1{
font-size:34px;
}

.number{
font-size:20px;
}

.label{
font-size:9px;
}

}

</style>
</head>

<body>

<div class="card">

<img src="/android-chrome-512x512.png" class="logo">

<div class="brand">eFootball Nepal</div>

<h1>Coming Soon...</h1>

<p class="subtitle">
We're cooking up something amazing.<br>
Stay with us a little longer.
</p>

<div class="countdown">

<div class="box">
<div id="days" class="number">00</div>
<div class="label">Days</div>
</div>

<div class="box">
<div id="hours" class="number">00</div>
<div class="label">Hours</div>
</div>

<div class="box">
<div id="minutes" class="number">00</div>
<div class="label">Minutes</div>
</div>

<div class="box">
<div id="seconds" class="number">00</div>
<div class="label">Seconds</div>
</div>

</div>

<div class="social">

<a href="https://www.facebook.com/share/1bYndqKpBM/" target="_blank">
<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg">
</a>

<a href="https://m.me/j/AbY6Z-raYhI7QYfY/?send_source=gc%3Acopy_invite_link_c" target="_blank">
<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/messenger.svg">
</a>

</div>

<div class="footer">
Officially Confirmed by <span>Ashish</span>
</div>

</div>

<script>

const target = new Date("2026-09-10T00:00:00+05:45");

function updateCountdown(){

const now = new Date();

const diff = target - now;

const days=Math.floor(diff/(1000*60*60*24));
const hours=Math.floor((diff/(1000*60*60))%24);
const minutes=Math.floor((diff/(1000*60))%60);
const seconds=Math.floor((diff/1000)%60);

document.getElementById("days").textContent=Math.max(days,0);
document.getElementById("hours").textContent=String(Math.max(hours,0)).padStart(2,"0");
document.getElementById("minutes").textContent=String(Math.max(minutes,0)).padStart(2,"0");
document.getElementById("seconds").textContent=String(Math.max(seconds,0)).padStart(2,"0");

}

updateCountdown();
setInterval(updateCountdown,1000);

</script>

</body>
</html>
