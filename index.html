<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#081322,#0f2d57,#173b72);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:#fff;
padding:20px;
overflow:hidden;
}

.card{
width:100%;
max-width:420px;
text-align:center;
background:rgba(255,255,255,.05);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.08);
border-radius:24px;
padding:35px 22px;
box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.logo{
width:95px;
height:95px;
border-radius:22px;
margin:auto;
display:block;
box-shadow:0 15px 35px rgba(0,0,0,.4);
}

h1{
margin-top:22px;
font-size:40px;
font-weight:800;
}

p{
margin-top:12px;
font-size:16px;
color:#c8d8f3;
line-height:1.6;
}

.countdown{
display:flex;
justify-content:space-between;
margin-top:35px;
gap:8px;
}

.box{
flex:1;
background:rgba(255,255,255,.06);
border-radius:16px;
padding:14px 6px;
}

.num{
font-size:24px;
font-weight:700;
}

.label{
margin-top:4px;
font-size:11px;
text-transform:uppercase;
color:#9dc7ff;
}

.social{
display:flex;
justify-content:center;
gap:18px;
margin-top:35px;
}

.social a{
width:52px;
height:52px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,.08);
border-radius:50%;
transition:.3s;
text-decoration:none;
}

.social a:hover{
transform:translateY(-4px);
background:#1877F2;
}

.social img{
width:28px;
height:28px;
}

.footer{
margin-top:28px;
font-size:13px;
color:#8fb5e9;
}

@media(max-width:400px){

h1{
font-size:34px;
}

.num{
font-size:20px;
}

.label{
font-size:10px;
}

.box{
padding:12px 4px;
}

}
</style>
</head>

<body>

<div class="card">

<img src="/android-chrome-512x512.png" class="logo">

<h1>Coming Soon...</h1>

<p>
We're cooking up something amazing.<br>
See you soon!
</p>

<div class="countdown">

<div class="box">
<div id="days" class="num">00</div>
<div class="label">Days</div>
</div>

<div class="box">
<div id="hours" class="num">00</div>
<div class="label">Hours</div>
</div>

<div class="box">
<div id="minutes" class="num">00</div>
<div class="label">Minutes</div>
</div>

<div class="box">
<div id="seconds" class="num">00</div>
<div class="label">Seconds</div>
</div>

</div>

<div class="social">

<a href="https://www.facebook.com/share/1bYndqKpBM/" target="_blank">
<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg">
</a>

<a href="https://m.me/j/AbY6Z-raYhI7QYfY/?send_source=gc%3Acopy_invite_link_c" target="_blank">
<img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/messenger.svg">
</a>

</div>

<div class="footer">
By Ashish
</div>

</div>

<script>

const target = new Date("2026-09-10T00:00:00+05:45");

function update(){

const now = new Date();

const diff = target - now;

const d = Math.floor(diff/1000/60/60/24);
const h = Math.floor(diff/1000/60/60)%24;
const m = Math.floor(diff/1000/60)%60;
const s = Math.floor(diff/1000)%60;

document.getElementById("days").textContent=d<0?0:d;
document.getElementById("hours").textContent=String(h).padStart(2,"0");
document.getElementById("minutes").textContent=String(m).padStart(2,"0");
document.getElementById("seconds").textContent=String(s).padStart(2,"0");

}

update();
setInterval(update,1000);

</script>

</body>
</html>
