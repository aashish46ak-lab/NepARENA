<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NepARENA | Coming Soon</title>
    <meta
      name="description"
      content="NepARENA is launching soon — multi-organizer esports tournament platform for Nepal."
    />
    <meta name="theme-color" content="#031027" />
    <meta property="og:title" content="NepARENA - Coming Soon" />
    <meta
      property="og:description"
      content="We're building the home for esports tournaments in Nepal. Stay tuned!"
    />
    <meta property="og:image" content="/neparena-logo.png" />
    <link rel="icon" href="/neparena-logo.png?v=6" type="image/png" sizes="any" />
    <link rel="shortcut icon" href="/neparena-logo.png?v=6" type="image/png" />
    <link rel="apple-touch-icon" href="/neparena-logo.png?v=6" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        min-height: 100%;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: #031027 !important;
        color: #fff;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at top, #0b1835 0%, #061226 45%, #02040a 100%) !important;
      }
      .wrap { width: 100%; max-width: 920px; text-align: center; }
      .logo {
        height: 130px;
        width: 130px;
        border-radius: 30px;
        object-fit: cover;
        box-shadow: 0 12px 40px rgba(14, 42, 86, 0.55), 0 0 0 1px rgba(147, 197, 253, 0.15);
      }
      .brand {
        margin-top: 20px;
        font-size: 15px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #93c5fd;
        font-weight: 600;
      }
      .title {
        margin-top: 12px;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: 2px;
        color: #dbeafe;
        line-height: 1.1;
      }
      .sub {
        margin-top: 12px;
        color: #93c5fd;
        font-size: 16px;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.5;
      }
      .count {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 28px;
        flex-wrap: wrap;
      }
      .cell {
        min-width: 78px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        padding: 16px 12px;
        border-radius: 14px;
      }
      .num {
        font-size: 26px;
        font-weight: 700;
        color: #e0f2fe;
        font-variant-numeric: tabular-nums;
      }
      .label {
        margin-top: 6px;
        font-size: 11px;
        color: #93c5fd;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .foot {
        margin-top: 32px;
        font-size: 13px;
        color: rgba(147, 197, 253, 0.7);
      }
      @media (min-width: 640px) {
        .logo { height: 150px; width: 150px; border-radius: 34px; }
        .title { font-size: 56px; }
        .cell { min-width: 100px; padding: 18px 16px; }
        .num { font-size: 30px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap" role="main">
      <img
        class="logo"
        src="/neparena-logo.png?v=6"
        alt="NepARENA"
        onerror="this.src='/android-chrome-512x512.png'"
      />
      <div class="brand">NepARENA</div>
      <h1 class="title">COMING SOON</h1>
      <p class="sub">
        Multi-organizer esports tournament platform for Nepal.
        We're putting the finishing touches — stay tuned!
      </p>
      <div class="count" aria-live="polite">
        <div class="cell">
          <div class="num" id="d">—</div>
          <div class="label">Days</div>
        </div>
        <div class="cell">
          <div class="num" id="h">—</div>
          <div class="label">Hours</div>
        </div>
        <div class="cell">
          <div class="num" id="m">—</div>
          <div class="label">Minutes</div>
        </div>
        <div class="cell">
          <div class="num" id="s">—</div>
          <div class="label">Seconds</div>
        </div>
      </div>
      <p class="foot">Launch target · 2 Sep 2026 · Nepal Time</p>
    </div>
    <script>
      (function () {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (r) {
              r.forEach(function (x) { x.unregister(); });
            });
          }
          if ("caches" in window) {
            caches.keys().then(function (k) {
              k.forEach(function (n) { caches.delete(n); });
            });
          }
        } catch (e) {}

        var target = new Date("2026-09-02T00:00:00+05:45").getTime();
        function pad(n) { return n < 10 ? "0" + n : String(n); }
        function tick() {
          var sec = Math.floor(Math.max(0, target - Date.now()) / 1000);
          document.getElementById("d").textContent = String(Math.floor(sec / 86400));
          document.getElementById("h").textContent = pad(Math.floor((sec % 86400) / 3600));
          document.getElementById("m").textContent = pad(Math.floor((sec % 3600) / 60));
          document.getElementById("s").textContent = pad(sec % 60);
        }
        tick();
        setInterval(tick, 1000);
      })();
    </script>
  </body>
</html>
