<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>eFootball Nepal • Coming Soon</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Inter,Arial,sans-serif;
      background:linear-gradient(180deg,#07111f,#030811);
      color:#fff;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:460px;
      text-align:center;
    }

    .logo{
      width:95px;
      height:95px;
      border-radius:22px;
      margin-bottom:25px;
      box-shadow:0 0 35px rgba(0,140,255,.35);
    }

    h1{
      font-size:2.3rem;
      font-weight:800;
      margin-bottom:12px;
      color:#fff;
    }

    p{
      color:#b8c8dc;
      font-size:1rem;
      line-height:1.6;
      margin-bottom:35px;
      padding:0 10px;
    }

    .countdown{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      margin-bottom:35px;
    }

    .box{
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      padding:15px 5px;
      backdrop-filter:blur(10px);
    }

    .num{
      font-size:1.5rem;
      font-weight:700;
      color:#fff;
    }

    .label{
      margin-top:5px;
      color:#8ca7c8;
      font-size:.72rem;
      text-transform:uppercase;
      letter-spacing:.8px;
    }

    .buttons{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .btn{
      text-decoration:none;
      color:#fff;
      background:#1877f2;
      padding:12px 22px;
      border-radius:12px;
      font-weight:600;
      transition:.2s;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .btn.messenger{
      background:#0084ff;
    }

    @media(max-width:420px){

      h1{
        font-size:1.9rem;
      }

      .num{
        font-size:1.25rem;
      }

      .label{
        font-size:.65rem;
      }

      .countdown{
        gap:8px;
      }

      .box{
        padding:12px 2px;
      }
    }
  </style>
</head>

<body>

<div class="container">

<img src="/android-chrome-512x512.png" class="logo" alt="Logo">

<h1>Coming Soon...</h1>

<p>
We're cooking up something awesome.<br>
Stay tuned—we'll see you very soon!
</p>

<div class="countdown">

<div class="box">
<div class="num" id="days">00</div>
<div class="label">Days</div>
</div>

<div class="box">
<div class="num" id="hours">00</div>
<div class="label">Hours</div>
</div>

<div class="box">
<div class="num" id="minutes">00</div>
<div class="label">Minutes</div>
</div>

<div class="box">
<div class="num" id="seconds">00</div>
<div class="label">Seconds</div>
</div>

</div>

<div class="buttons">

<a class="btn messenger"
href="https://m.me/j/AbY6Z-raYhI7QYfY/?send_source=gc%3Acopy_invite_link_c"
target="_blank">
💬 Messenger GC
</a>

<a class="btn"
href="https://www.facebook.com/share/1bYndqKpBM/"
target="_blank">
📘 Facebook Page
</a>

</div>

</div>

<script>

const target=new Date("2026-09-02T00:00:00+05:45");

function update(){

const now=new Date();

let diff=target-now;

if(diff<0)diff=0;

const days=Math.floor(diff/1000/60/60/24);

const hours=Math.floor(diff/1000/60/60)%24;

const minutes=Math.floor(diff/1000/60)%60;

const seconds=Math.floor(diff/1000)%60;

document.getElementById("days").innerText=days;

document.getElementById("hours").innerText=String(hours).padStart(2,"0");

document.getElementById("minutes").innerText=String(minutes).padStart(2,"0");

document.getElementById("seconds").innerText=String(seconds).padStart(2,"0");

}

update();

setInterval(update,1000);

</script>

</body>
</html>
